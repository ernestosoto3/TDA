name: Pull Request Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Run API E2E tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://tda_app:test_password@localhost:5432/tda_local
          TEST_DATABASE_URL: postgresql://tda_app:test_password@localhost:5432/tda_test
          DATABASE_SSL_MODE: disable
          DATABASE_POOL_MAX: '10'
          DATABASE_CONNECTION_TIMEOUT_MS: '5000'
          DATABASE_IDLE_TIMEOUT_MS: '30000'
        run: pnpm --filter @tda/api test:e2e --runInBand

      - name: Build applications
        run: pnpm build
